[package]
edition = "2024"
name = "buffex_iroh"
version = "0.1.0"

authors = ["lino <lino_snsalias@outlook.com>"]
description = "Send or receive data through a circular buffer attached to the IROH stream."
license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
buffex = { path = "../buffex" }
abs_buff_tokio_adapt = { path = "../abs_buff_tokio_adapt" }
abs_art-facde = { git = "https://gitee.com/lino_snsalias/abs_art.git", branch = "dev/0.3.0" }
anylr = { git = "https://gitee.com/lino_snsalias/anylr.rs.git", branch = "dev/0.2.0" }
mm_ptr = { git = "https://gitee.com/lino_snsalias/mm_ptr.git", branch = "dev/0.2.0" }

futures-lite = { version = "2" }

anyhow = "1"
thiserror = "2"
iroh = "1.3.*"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
