[package]
name = "abs_buff_stdio_adapt"
version = "0.3.0"
edition = "2024"
description = "Adapter to make std::io::{Read, Write} fit for abs_buff TrBuffRead/TrBuffWrite."
license = "MIT/Apache-2.0"

[dependencies]
abs_buff = { path = "../abs_buff" }
# 后端选择统一交给门面：本 crate 只认 `abs_art_facade::Runtime`，不再直接依赖
# `abs_art` / `abs_art-bridge`，也不再自己维护 `rt-*` 三选一。门面的缺省是 compio，
# 因此本 crate 单独编译/自测时就是 compio；下游谁点亮 `abs_art-facade/rt-tokio`，
# 全图（含这里的同步等待）就都是 tokio。
abs_art-facade = { git = "https://gitee.com/lino_snsalias/abs_art.git", branch = "dev/0.3.0" }

# 测试专用的依赖（不影响库本身）：
# - `compio`：提供 `#[compio::test]` 属性，让测试运行在 compio 运行时上下文中
#   （门面的缺省后端正是 compio）。
# - `buffex`：SPSC 环形管道（`buffex::ring`）作为"异步数据流"的测试载体（实现
#   abs_buff 的 TrBuffRead / TrBuffWrite，空/满时会真实地 Pending 等待对端）。
#
# 这两个依赖一律走**本地 path**：本 crate、`abs_buff-testkit` 与 `buffex` 现在同属
# 一个 workspace，path 依赖让 Cargo 只解析出**唯一一个** `abs_buff` 实例。若仍写
# 上游 git 源，`buffex` 的 `Ring` 实现的就是 git 版 `abs_buff` 的
# `TrBuffRead` / `TrBuffWrite`，与本 crate 使用的 path 版互不相干，测试会报
# `the trait bound ... is not satisfied`（并提示存在多个 abs_buff 版本）。
[dev-dependencies]
abs_buff-testkit = { path = "../abs_buff-testkit" }
buffex = { path = "../buffex" }
compio = { version = "0.19.*", features = ["fs", "macros", "time"] }
